# Production / self-host. Publishes :8000 on the host.
# TLS in front (does not publish 8000):
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml up --build -d
# Local demo overlay:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  bookclub:
    build: .
    restart: unless-stopped
    init: true
    expose:
      - "8000"
    ports:
      - "${BOOKCLUB_PORT:-8000}:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-}
      BOOKCLUB_BOOTSTRAP_INVITE: ${BOOKCLUB_BOOTSTRAP_INVITE:-}
      BOOKCLUB_HTTPS: ${BOOKCLUB_HTTPS:-auto}
      BOOKCLUB_TRUSTED_PROXIES: ${BOOKCLUB_TRUSTED_PROXIES:-*}
      BOOKCLUB_NAME: ${BOOKCLUB_NAME:-Bookclub}
      BOOKCLUB_THEME: ${BOOKCLUB_THEME:-}
      BOOKCLUB_THEME_DARK: ${BOOKCLUB_THEME_DARK:-}
      BOOKCLUB_PUBLIC_URL: ${BOOKCLUB_PUBLIC_URL:-}
      DEBUG: ${DEBUG:-0}
      DATABASE_PATH: /data/bookclub.db
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ${BOOKCLUB_DATA:-./data}:/data
    healthcheck:
      test: ["CMD", "gosu", "bookclub", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
