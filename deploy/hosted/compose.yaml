# Bookclub, hosted: the app and its Postgres on one VM. README.md next to this file is the
# runbook, and env.example lists every setting. In short:
#
#   install -d -o 1000 -g 1000 -m 0750 /srv/bookclub/media /srv/bookclub/legal
#   cp env.example .env && chmod 600 .env     # then fill it in
#   docker compose up -d --wait
#
# Compose reads .env twice: for the ${…} below, and as the app's environment (env_file).
name: bookclub

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookclub
      POSTGRES_DB: bookclub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see env.example)}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # No published port, and a network without a route out: only the app reaches it.
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookclub -d bookclub"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
      start_interval: 1s
    stop_grace_period: 30s
    logging: *logging

  app:
    image: git.tillhome.de/rafiistcool/bookclub-server:${BOOKCLUB_TAG:-stable}
    restart: unless-stopped
    env_file:
      # Not `required`, so that `docker compose --env-file env.example config` can check this
      # file in the repo, where no .env exists. On the VM a missing .env already stops compose
      # at ${POSTGRES_PASSWORD:?} above, and the server refuses to start without DATABASE_URL.
      - path: ${BOOKCLUB_ENV_FILE:-.env}
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BOOKCLUB_LISTEN:-0.0.0.0}:${BOOKCLUB_PORT:-8080}:8080"
    volumes:
      # Both directories must exist and belong to uid 1000 (README.md, "First boot"). Compose
      # would otherwise create them owned by root, which the app cannot write.
      - type: bind
        source: ${BOOKCLUB_DATA_DIR:-/srv/bookclub}/media
        target: /data/media
        bind:
          create_host_path: false
      - type: bind
        source: ${BOOKCLUB_DATA_DIR:-/srv/bookclub}/legal
        target: /app/legal
        read_only: true
        bind:
          create_host_path: false
    networks: [db, default]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # The server stops taking requests, lets open ones finish and gives its jobs 10 s.
    stop_grace_period: 30s
    logging: *logging

networks:
  db:
    internal: true

volumes:
  postgres-data:
