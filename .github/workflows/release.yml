name: Release

# The GitHub copy of .forgejo/workflows/release.yml, disabled on GitHub (GitHub is a push mirror
# of Forgejo). It publishes the same hosted image, the Rust server with the web app (root
# Dockerfile), as ghcr.io/<owner>/bookclub-server with the same tags. Runs only for version
# tags; pushes to branches and pull requests never reach the registry.
on:
  push:
    tags: ["v*"]

# Runs for different tags may overlap; deploy/hosted/release-tags.sh makes the order in which
# they end irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/bookclub-server

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck (incl. Vue templates)
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Build
        run: npm run build

  # The server job of ci.yml, unchanged.
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bookclub
          POSTGRES_PASSWORD: bookclub
          POSTGRES_DB: bookclub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookclub"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://bookclub:bookclub@localhost:5432/bookclub
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Format
        run: cargo fmt --check
      # sqlx-cli has no prebuilt binaries; rust-cache keeps ~/.cargo/bin, so this is a no-op
      # after the first run.
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features rustls,postgres
      # The query macros check against the live schema, so migrate before compiling.
      - name: Migrate
        run: cargo sqlx migrate run
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Offline query data is current
        run: cargo sqlx prepare --check -- --all-targets
      - name: Test
        run: cargo test --locked
      # frontend/src/api/generated.ts comes from the OpenAPI document (#47): regenerate it and fail
      # if it differs from the committed file. This job has already built the server, so the check
      # adds only a Node setup and `npm ci` here; the frontend job would need a Rust toolchain and
      # a second full build.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Generated API types are current
        working-directory: frontend
        run: npm run check:api

  publish:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: [frontend, server]
    steps:
      # metadata-action skips the semver tag of a tag it cannot parse (v1.2, v1.2.3.4) with only
      # a warning, which would leave the build without a tag to push.
      - name: The tag is a version
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::$GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-prerelease"
            exit 1
          }

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 -> 1.2.3 here; 1.2 and stable follow in the last step. Never `latest`, and no
      # floating major.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=Bookclub
            org.opencontainers.image.description=Bookclub, the hosted book club service: the server and its web app in one image. Needs Postgres.
            org.opencontainers.image.documentation=https://git.tillhome.de/rafiistcool/bookclub/src/branch/main/deploy/hosted/README.md

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Floating tags
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: deploy/hosted/release-tags.sh "$IMAGE" "$GITHUB_REF_NAME" "$DIGEST"
