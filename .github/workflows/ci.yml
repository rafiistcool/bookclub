name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck (incl. Vue templates)
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Build
        run: npm run build

  # The production image (#51): build the root Dockerfile without pushing, boot it with
  # deploy/hosted/compose.yaml and ci.env, and ask /api/health, / and a script from a container on
  # the compose network (deploy/hosted/smoke-test.sh). The names below are unique per run, so
  # runs that share a daemon do not collide. On Forgejo the job runs on a runner of its own
  # (label `docker-host`); GitHub's hosted runners are VMs with a Docker daemon of their own.
  image:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: bookclub-ci-${{ github.run_id }}
      BOOKCLUB_TAG: ci-${{ github.run_id }}
      BOOKCLUB_DATA_DIR: /tmp/bookclub-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - name: Build, boot and probe the image
        run: deploy/hosted/smoke-test.sh
      # The script tears the stack down itself; a cancelled run may not get that far, and the
      # stack's `restart: unless-stopped` would keep it running on the daemon.
      - name: Tear down after a cancelled run
        if: cancelled()
        run: deploy/hosted/smoke-test.sh --down

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bookclub
          POSTGRES_PASSWORD: bookclub
          POSTGRES_DB: bookclub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookclub"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://bookclub:bookclub@localhost:5432/bookclub
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Format
        run: cargo fmt --check
      # sqlx-cli has no prebuilt binaries; rust-cache keeps ~/.cargo/bin, so this is a no-op
      # after the first run.
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features rustls,postgres
      # The query macros check against the live schema, so migrate before compiling.
      - name: Migrate
        run: cargo sqlx migrate run
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Offline query data is current
        run: cargo sqlx prepare --check -- --all-targets
      - name: Test
        run: cargo test --locked
      # frontend/src/api/generated.ts comes from the OpenAPI document (#47): regenerate it and fail
      # if it differs from the committed file. This job has already built the server, so the check
      # adds only a Node setup and `npm ci` here; the frontend job would need a Rust toolchain and
      # a second full build.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Generated API types are current
        working-directory: frontend
        run: npm run check:api
