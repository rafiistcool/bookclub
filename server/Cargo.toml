[package]
name = "bookclub-server"
version = "0.1.0"
edition = "2024"

# Every Phase 1 dependency is added here in Wave 1 (docs/phase1/conventions.md §18).
# Wave 2 packages do not add crates; bump rusqlite and sqlx together (libsqlite3-sys range).
[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["multipart", "macros"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
base64 = "0.23.1"
bytes = "1"
caseless = "0.2.2"
clap = { version = "4.6.7", features = ["derive", "env"] }
csv = "1.4.0"
futures = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
ipnet = "2.12.2"
jiff = { version = "0.2.38", features = ["tzdb-bundle-always"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "pool", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
moka = { version = "0.12.16", features = ["future", "sync"] }
quick-xml = "0.42.0"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "http2", "charset", "stream"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "time", "json"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "serde-human-readable", "formatting", "parsing", "macros"] }  # human-readable: Date as YYYY-MM-DD
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header", "trace", "request-id", "cors", "catch-panic", "limit", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.26"  # NFC for catalog text (DNB MARC is decomposed)
url = "2.5.8"
utoipa = { version = "6.0.0", features = ["macros", "axum_extras", "time", "preserve_order"] }
utoipa-axum = "0.3.0"
webp = "0.3.1"
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
wiremock = "0.6.5"

# Line tables only: keeps each worktree's target/ small enough for parallel builds on the VM.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
