# Laeuft auf dem eigenen Forgejo-Runner. Image geht in die Forgejo-Registry (git.tillhome.de), nur amd64.
name: Release

# Publishes the hosted image, the Rust server with the web app (root Dockerfile), to the Forgejo
# registry as git.tillhome.de/rafiistcool/bookclub-server. Runs only for version tags pushed to
# Forgejo, so a release is `git tag v0.11.0 && git push origin v0.11.0`. Pushes to branches and
# pull requests never reach the registry. deploy/hosted/README.md, "Releases", lists the tags.
on:
  push:
    tags: ["v*"]

# Runs for different tags may overlap; deploy/hosted/release-tags.sh makes the order in which
# they end irrelevant. A workflow-wide group would not help: a newer pending run cancels an older
# pending one, which would drop that release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: git.tillhome.de/rafiistcool/bookclub-server

# Every action is pinned to a commit, its release in the comment: a tag or a branch can be moved
# to other code, and `publish` hands its actions the registry token and the Docker daemon of the
# runner's host (security review, Phase 2 Wave 1 #2). Move a pin on purpose, after reading the
# release: `git ls-remote https://github.com/<owner>/<repo> refs/tags/<version>` prints the
# commit (for an annotated tag, the `^{}` line). ci.yml pins the same commits, and
# server/tests/deploy_env.rs fails on a `uses:` without one.
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck (incl. Vue templates)
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Build
        run: npm run build

  # The server job of ci.yml, unchanged.
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bookclub
          POSTGRES_PASSWORD: bookclub
          POSTGRES_DB: bookclub
        options: >-
          --health-cmd "pg_isready -U bookclub"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://bookclub:bookclub@postgres:5432/bookclub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch head 2026-10-16)
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      - name: Format
        run: cargo fmt --check
      # sqlx-cli has no prebuilt binaries; rust-cache keeps ~/.cargo/bin, so this is a no-op
      # after the first run.
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features rustls,postgres
      # The query macros check against the live schema, so migrate before compiling.
      - name: Migrate
        run: cargo sqlx migrate run
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Offline query data is current
        run: cargo sqlx prepare --check -- --all-targets
      - name: Test
        run: cargo test --locked
      # frontend/src/api/generated.ts comes from the OpenAPI document (#47): regenerate it and fail
      # if it differs from the committed file. This job has already built the server, so the check
      # adds only a Node setup and `npm ci` here; the frontend job would need a Rust toolchain and
      # a second full build.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Generated API types are current
        working-directory: frontend
        run: npm run check:api

  publish:
    name: Build and push image
    # The runner whose job containers get the Docker daemon, as ci.yml's `image` job
    # (docs/phase2/notes/dep.md, "The runner").
    runs-on: docker-host
    needs: [frontend, server]
    steps:
      # metadata-action skips the semver tag of a tag it cannot parse (v1.2, v1.2.3.4) with only
      # a warning, which would leave the build without a tag to push.
      - name: The tag is a version
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::$GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-prerelease"
            exit 1
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The docker-container driver: the default `docker` driver cannot export a registry cache.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # REGISTRY_TOKEN: a Forgejo access token of the repository owner with write:package.
      - name: Log in to the Forgejo registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: git.tillhome.de
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # v1.2.3 -> 1.2.3 here; the floating tags 1.2 and stable follow in the last step, once
      # this version is in the registry. There is never a `latest` (flavor) and no floating
      # major. deploy/hosted/compose.yaml follows `stable` unless BOOKCLUB_TAG pins a version.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=Bookclub
            org.opencontainers.image.description=Bookclub, the hosted book club service: the server and its web app in one image. Needs Postgres.
            org.opencontainers.image.documentation=https://git.tillhome.de/rafiistcool/bookclub/src/branch/main/deploy/hosted/README.md

      # The registry cache keeps every stage's layers (mode=max) under the tag `buildcache`, so
      # the next release rebuilds only what changed; the Dockerfile builds the Rust dependencies
      # in a layer of their own. image-manifest and oci-mediatypes store the cache as a plain OCI
      # image, which registries without BuildKit's cache manifest type accept.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # One plain image manifest per tag, without attestation manifests next to it.
          provenance: false
          sbom: false
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      # 1.2 when this is the highest release of 1.2, stable when it is the highest of all,
      # judged from the remote's tags now: a backport or a run that ends after a newer
      # release's run moves neither. A pre-release moves nothing.
      - name: Floating tags
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: deploy/hosted/release-tags.sh "$IMAGE" "$GITHUB_REF_NAME" "$DIGEST"
