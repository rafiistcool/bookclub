# Laeuft auf dem eigenen Forgejo-Runner (git.tillhome.de). Die GitHub-Variante unter .github/workflows ist auf GitHub deaktiviert.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck (incl. Vue templates)
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Build
        run: npm run build

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bookclub
          POSTGRES_PASSWORD: bookclub
          POSTGRES_DB: bookclub
        options: >-
          --health-cmd "pg_isready -U bookclub"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://bookclub:bookclub@postgres:5432/bookclub
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Format
        run: cargo fmt --check
      # sqlx-cli has no prebuilt binaries; rust-cache keeps ~/.cargo/bin, so this is a no-op
      # after the first run.
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features rustls,postgres
      # The query macros check against the live schema, so migrate before compiling.
      - name: Migrate
        run: cargo sqlx migrate run
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Offline query data is current
        run: cargo sqlx prepare --check -- --all-targets
      - name: Test
        run: cargo test --locked
      # frontend/src/api/generated.ts comes from the OpenAPI document (#47): regenerate it and fail
      # if it differs from the committed file. This job has already built the server, so the check
      # adds only a Node setup and `npm ci` here; the frontend job would need a Rust toolchain and
      # a second full build.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Generated API types are current
        working-directory: frontend
        run: npm run check:api
